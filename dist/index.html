    <style>
      /* Evitar flash blanco al cargar */
      html, body {
        background-color: #0D0D0D;
        margin: 0;
        padding: 0;
      }
      /* Spinner de carga inicial */
      #splash {
        position: fixed;
        inset: 0;
        background: #0D0D0D;
        display: flex;
        align-items: center;
        justify-content: center;
        z-index: 9999;
        transition: opacity 0.3s;
      }
      #splash.hidden { opacity: 0; pointer-events: none; }
      .spinner {
        width: 40px;
        height: 40px;
        border: 3px solid rgba(29,158,117,0.2);
        border-top-color: #1D9E75;
        border-radius: 50%;
        animation: spin 0.8s linear infinite;
      }
      @keyframes spin { to { transform: rotate(360deg); } }
    </style>
    <script type="module" crossorigin src="/assets/index-Dova-ujr.js"></script>
    <link rel="stylesheet" crossorigin href="/assets/index-B3prvxip.css">
  </head>
  <body>
    <div id="splash"><div class="spinner"></div></div>
    <div id="root"></div>
    <script>
      // Ocultar splash cuando React cargue
      window.addEventListener('load', () => {
        setTimeout(() => {
          const splash = document.getElementById('splash')
          if (splash) {
            splash.classList.add('hidden')
            setTimeout(() => splash.remove(), 300)
          }
        }, 500)
      })
    </script>
  </body>
</html>
